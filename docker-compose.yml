services:
    postgres:
        image: postgres:15
        container_name: bot-db
        env_file:
            - .env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: always

    app:
        image: node:18
        container_name: bot-node
        working_dir: /app
        volumes:
            - .:/app
        depends_on:
            - postgres
        env_file:
            - .env
        ports:
            - "${WEBHOOKS_PORT}:3333"
        command: bash -c "npm install && npm run build && npm run start"

volumes:
    postgres_data:
